<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TimeCam">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Oswald:wght@300;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<title>TimeCam</title>
<style>
  :root { --gold:#E8B84A; --bg:#fff; --ink:#111; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); font-family:Poppins,system-ui,sans-serif; overflow:hidden; overscroll-behavior:none; }
  .app { position:fixed; top:0; left:0; right:0; height:var(--app-h, 100dvh); display:flex; flex-direction:column; }

  /* Top bar (matches Timemark) */
  .top { padding:env(safe-area-inset-top) 10px 6px; display:flex; align-items:center; gap:6px; background:#fff; }
  .icon-btn { width:42px; height:42px; border:0; background:none; display:grid; place-items:center; padding:0; flex:none; }
  .icon-btn svg { width:28px; height:28px; stroke:#111; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .top .spacer { flex:1; }
  .pill { border:1.5px solid #111; border-radius:999px; padding:4px 11px 4px 8px; font:700 15px/1.2 Poppins; display:flex; gap:5px; align-items:center; background:#fff; color:#111; white-space:nowrap; }
  .pill svg { width:18px; height:18px; stroke:#111; fill:none; stroke-width:2; }
  .plus { border:0; border-radius:999px; padding:6px 13px; background:#1c1c1c; color:#fff; font:700 15px/1.2 Poppins; display:flex; gap:4px; align-items:center; white-space:nowrap; }
  .plus span { color:#F5D23C; font-size:16px; }

  /* Viewfinder */
  .stage { position:relative; flex:1; min-height:0; background:#000; overflow:hidden; }
  video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform-origin:center; }
  video.mirror { transform:scaleX(-1); }
  .msg { position:absolute; inset:0 0 40% 0; display:grid; place-items:center; color:#fff; text-align:center; padding:24px; font-size:15px; }
  .msg button { margin-top:12px; background:var(--gold); color:#111; border:0; border-radius:999px; padding:10px 20px; font:600 15px Poppins; }

  /* Right rail: sits just above the bottom panel */
  .rail { position:absolute; right:8px; bottom:calc(var(--panel-h, 250px) + 12px); display:flex; flex-direction:column; align-items:center; gap:14px; }
  .zoom { display:flex; flex-direction:column; gap:14px; align-items:center; margin-bottom:16px; }
  .zoom button { width:28px; height:28px; border-radius:50%; border:0; background:rgba(60,60,60,.55); color:#fff; font:500 12px Poppins; padding:0; }
  .zoom button.on { width:36px; height:36px; border:2px solid #fff; background:rgba(40,40,40,.7); font-size:13px; }
  .side { display:flex; flex-direction:column; gap:22px; }
  .side button { width:36px; height:36px; border:0; background:none; padding:0; display:grid; place-items:center; }
  .side svg { width:30px; height:30px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 1px 2px rgba(0,0,0,.4)); }

  /* Bottom translucent panel over the viewfinder */
  .panel { position:absolute; left:0; right:0; bottom:0; background:rgba(55,55,55,.72); padding:10px 0 12px; }
  .team { display:block; margin:0 auto; border:0; background:none; color:#fff; font:600 16px Poppins; padding:4px 10px; }
  .team b { font-weight:400; margin-left:8px; }
  .controls { display:flex; align-items:center; justify-content:space-around; padding:14px 8px 0; }
  .thumb { width:96px; text-align:center; color:#fff; font:600 13px Poppins; border:0; background:none; padding:0; }
  .thumb .box { width:38px; height:38px; margin:0 auto 6px; border-radius:6px; background:rgba(255,255,255,.12) center/cover; border:2px solid #fff; }
  .shutter { -webkit-appearance:none; appearance:none; width:76px; height:76px; padding:0; margin:0; border-radius:50%; border:5px solid #fff; background:transparent; flex:none; display:grid; place-items:center; overflow:hidden; box-sizing:border-box; }
  .shutter:active .dot { background:rgba(255,255,255,.3); }
  .video-mode .shutter:active .dot { background:#d62f26; }
  button { -webkit-appearance:none; appearance:none; font-family:inherit; }
  .tpl svg { width:34px; height:34px; stroke:#fff; fill:none; stroke-width:2; margin:0 auto 6px; display:block; }

  .shutter .dot { display:block; width:58px; height:58px; border-radius:50%; background:transparent; transition:transform .2s, border-radius .2s; }
  .video-mode .shutter .dot { background:#ff3b30; }
  .recording .shutter .dot { border-radius:10px; transform:scale(.45); }
  .rec { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:#ff3b30; color:#fff; font:600 15px Poppins; padding:4px 12px; border-radius:6px; display:none; font-variant-numeric:tabular-nums; }
  .recording .rec { display:block; }
  .recording .rail, .recording #flipBtn, .recording .modes, .recording .thumb, .recording .team { opacity:.3; pointer-events:none; }
  [hidden] { display:none !important; }
  .preview video { width:100%; border-radius:10px; display:block; background:#000; }

  /* Watermark — same proportions as the saved photo (0.82 of a 390px layout) */
  .wm { position:relative; margin:8px 14px 0; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.35); pointer-events:none; }
  .wm-row { display:flex; align-items:stretch; gap:10px; }
  .wm-time { font:300 52px/1 Oswald, sans-serif; letter-spacing:1px; }
  .wm-bar { width:3px; background:var(--gold); border-radius:2px; }
  .wm-dd { display:flex; flex-direction:column; justify-content:space-between; font:400 15px Oswald,sans-serif; padding:2px 0; }
  .wm-loc { margin-top:8px; font:400 15px Oswald,sans-serif; }
  .wm-note { margin-top:8px; display:inline-block; background:rgba(255,255,255,.12); border-radius:5px; padding:6px 11px; font:400 15px Oswald,sans-serif; }
  .wm-note:empty { display:none; }

  /* Bottom mode bar */
  .modes { background:#fff; padding:8px 8px max(calc(env(safe-area-inset-bottom) - 10px), 12px); display:flex; justify-content:center; gap:56px; font:600 16px/1.2 Poppins; color:#9a9a9a; }
  .modes span { padding:4px 6px; cursor:pointer; }
  .modes span.on { color:#111; position:relative; }
  .modes span.on::after { content:""; position:absolute; left:50%; bottom:-6px; width:6px; height:6px; border-radius:50%; background:#111; transform:translateX(-50%); }

  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .25s; }
  .flash.go { opacity:.8; transition:none; }

  /* Sheets */
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; z-index:10; }
  .sheet.open { display:flex; }
  .card { background:#fff; width:100%; border-radius:18px 18px 0 0; padding:20px 18px calc(env(safe-area-inset-bottom) + 18px); max-height:90vh; overflow:auto; }
  .card h3 { margin:0 0 14px; font-size:18px; }
  .card label { display:block; font-size:13px; color:#666; margin:12px 0 4px; }
  .card input, .card textarea { width:100%; font:16px Poppins; padding:10px 12px; border:1px solid #ddd; border-radius:10px; }
  .row { display:flex; gap:10px; margin-top:16px; }
  .btn { flex:1; border:0; border-radius:12px; padding:13px; font:600 16px Poppins; background:#111; color:#fff; }
  .btn.alt { background:#eee; color:#111; }
  .btn.gold { background:var(--gold); color:#111; }
  .preview img { width:100%; border-radius:10px; display:block; }
  .hint { font-size:12px; color:#888; margin-top:10px; text-align:center; }
  .toggle { display:flex; align-items:center; justify-content:space-between; margin-top:14px; font-size:15px; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="icon-btn" id="menuBtn" aria-label="Pengaturan"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h14M3 18h10"/></svg></button>
    <button class="icon-btn" id="torchBtn" aria-label="Flash"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/><path d="M3 3l18 18" id="torchSlash"/></svg></button>
    <div class="spacer"></div>
    <button class="icon-btn" id="flipBtn" aria-label="Ganti kamera"><svg viewBox="0 0 24 24"><path d="M20 15V8a3 3 0 0 0-3-3h-1.5"/><path d="M4 9v7a3 3 0 0 0 3 3h1.5"/><path d="M17.5 3 15.5 5l2 2"/><path d="M6.5 21l2-2-2-2"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>

  <div class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <div class="msg" id="msg"><div>Mengaktifkan kamera…</div></div>
    <div class="flash" id="flash"></div>
    <div class="rec" id="recTime">00:00</div>

    <div class="rail">
      <div class="zoom" id="zoom">
        <button data-z="2">2</button>
        <button data-z="1" class="on">1x</button>
        <button data-z="0.5">0.5</button>
      </div>
      <div class="side">
        <button id="editBtn" aria-label="Edit catatan"><svg viewBox="0 0 24 24"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L13 14l-4 1 1-4z"/></svg></button>
        <button id="locBtn" aria-label="Refresh lokasi"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="3"/></svg></button>
      </div>
    </div>

    <div class="panel" id="panel">
      <button class="team" id="teamBtn">Edit Watermark<b>→</b></button>
      <div class="controls">
        <button class="thumb" id="thumbBtn"><div class="box" id="thumbBox"></div>Preview</button>
        <button class="shutter" id="shutter" aria-label="Ambil foto"><span class="dot"></span></button>
        <button class="thumb tpl" id="tplBtn"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10h8M8 14h6M8 17.5h3"/></svg>Templates</button>
      </div>
      <div class="wm" id="wm">
        <div class="wm-row">
          <div class="wm-time" id="wTime">--:--</div>
          <div class="wm-bar"></div>
          <div class="wm-dd"><span id="wDate"></span><span id="wDay"></span></div>
        </div>
        <div class="wm-loc" id="wLoc">Mencari lokasi…</div>
        <div><span class="wm-note" id="wNote"></span></div>
      </div>
    </div>
  </div>

  <div class="modes" id="modes"><span data-mode="video">Video</span><span data-mode="photo" class="on">Photo</span></div>
</div>

<!-- Edit sheet -->
<div class="sheet" id="editSheet">
  <div class="card">
    <h3>Edit Watermark</h3>
    <label>Lokasi (kosongkan untuk otomatis dari GPS)</label>
    <input id="inLoc" placeholder="Jalan …, Kota, Provinsi">
    <label>Catatan</label>
    <textarea id="inNote" rows="2" placeholder="I've been here :)"></textarea>
    <div class="toggle"><span>Tampilkan koordinat</span><input type="checkbox" id="inCoord" style="width:auto"></div>
    <div class="row"><button class="btn alt" data-close>Batal</button><button class="btn" id="saveEdit">Simpan</button></div>
  </div>
</div>

<!-- Preview sheet -->
<div class="sheet" id="prevSheet">
  <div class="card preview">
    <img id="prevImg" alt="Hasil foto">
    <video id="prevVid" controls playsinline hidden></video>
    <div class="row"><button class="btn alt" data-close>Tutup</button><button class="btn gold" id="saveBtn">Simpan ke Foto</button></div>
    <div class="hint">Di iPhone: tekan "Simpan ke Foto" → pilih <b>Save Image</b> / <b>Save Video</b>. Atau tekan-tahan gambar → Save to Photos.</div>
  </div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), msg = $('msg');
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const state = {
  facing: 'environment', zoom: 1, deviceId: null, lenses: null, torch: false, stream: null,
  autoLoc: 'Mencari lokasi…', coords: null,
  manualLoc: store.get('manualLoc', ''), note: store.get('note', "I've been here :)"), showCoord: store.get('showCoord', false),
  lastBlob: null, lastUrl: null
};

/* ---------- Clock ---------- */
function tick() {
  const d = new Date();
  $('wTime').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  $('wDate').textContent = `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  $('wDay').textContent = DAYS[d.getDay()];
}
tick(); setInterval(tick, 1000);

function locText() {
  let t = state.manualLoc || state.autoLoc;
  if (state.showCoord && state.coords) t += `\n${state.coords.lat.toFixed(6)}, ${state.coords.lon.toFixed(6)}`;
  return t;
}
function renderWm() {
  $('wLoc').innerText = locText();
  $('wNote').textContent = state.note;
}
renderWm();

/* ---------- Camera ---------- */
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('timeout'), { name: 'Timeout' })), ms))]);
async function startCamera() {
  if (document.body.classList.contains('recording')) stopRecording();
  if (state.stream) state.stream.getTracks().forEach(t => t.stop());
  msg.style.display = 'grid';
  msg.innerHTML = '<div>Mengaktifkan kamera…<br><small>Izinkan akses kamera jika diminta</small></div>';
  // Try high resolution first, then fall back if the browser refuses or stalls
  // A specific lens (e.g. ultra-wide for 0.5x) is picked by deviceId; otherwise by front/back
  const pick = state.deviceId ? { deviceId: { exact: state.deviceId } } : { facingMode: { ideal: state.facing } };
  const tries = [
    { ...pick, width: { ideal: 3840 }, height: { ideal: 2160 }, aspectRatio: { ideal: 16 / 9 } },
    { ...pick, width: { ideal: 1920 }, height: { ideal: 1080 }, aspectRatio: { ideal: 16 / 9 } },
    state.deviceId ? pick : { facingMode: state.facing }
  ];
  let lastErr;
  for (const v of tries) {
    try {
      state.stream = await withTimeout(navigator.mediaDevices.getUserMedia({ audio: false, video: v }), 10000);
      video.srcObject = state.stream;
      video.classList.toggle('mirror', state.facing === 'user');
      video.play().catch(() => {});
      await withTimeout(new Promise(r => video.readyState >= 2 ? r() : video.addEventListener('loadeddata', r, { once: true })), 5000);
      msg.style.display = 'none';
      if (!state.lenses) findLenses();
      state.torch = false; updateTorchIcon();
      return;
    } catch (e) {
      lastErr = e;
      if (e.name === 'NotAllowedError') break;            // permission denied: no point retrying
      if (state.stream) state.stream.getTracks().forEach(t => t.stop());
    }
  }
  const hint = lastErr && lastErr.name === 'NotAllowedError'
    ? 'Izin kamera ditolak. Buka Settings → Safari → Camera → Allow, lalu coba lagi.'
    : 'Kamera tidak bisa diakses.';
  msg.innerHTML = `<div>${hint}<br><small>${(lastErr && lastErr.name) || ''}</small><br><button id="retry">Coba lagi</button></div>`;
  $('retry').onclick = startCamera;
}
$('flipBtn').onclick = () => {
  state.facing = state.facing === 'environment' ? 'user' : 'environment';
  state.deviceId = null; setZoomUI(1); applyDigitalZoom(1); startCamera();
};

/* Find the iPhone's physical back lenses (labels are available after camera permission) */
async function findLenses() {
  try {
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const back = cams.filter(d => /back|belakang|rear/i.test(d.label));
    state.lenses = {
      ultra: back.find(d => /ultra/i.test(d.label)),
      tele: back.find(d => /tele/i.test(d.label)),
      wide: back.find(d => /^back camera$|^kamera belakang$/i.test(d.label.trim())) ||
            back.find(d => !/ultra|tele|dual|triple/i.test(d.label))
    };
  } catch { state.lenses = {}; }
}

/* Torch (Android Chrome supports; iOS Safari usually not) */
function updateTorchIcon() { $('torchSlash').style.display = state.torch ? 'none' : ''; }
$('torchBtn').onclick = async () => {
  const track = state.stream && state.stream.getVideoTracks()[0];
  const caps = track && track.getCapabilities ? track.getCapabilities() : {};
  if (!caps.torch) { alert('Flash tidak didukung browser ini (Safari iPhone belum mendukung flash untuk web app).'); return; }
  state.torch = !state.torch;
  try { await track.applyConstraints({ advanced: [{ torch: state.torch }] }); } catch {}
  updateTorchIcon();
};

/* Zoom: 0.5 = ultra-wide lens, 1x = main lens, 2 = telephoto lens if present, else 2x digital */
function setZoomUI(z) {
  [...$('zoom').children].forEach(x => { const on = +x.dataset.z === z; x.classList.toggle('on', on); x.textContent = x.dataset.z + (on ? 'x' : ''); });
}
function applyDigitalZoom(d) {
  state.zoom = d;
  video.style.transform = (state.facing === 'user' ? 'scaleX(-1) ' : '') + `scale(${d})`;
}
$('zoom').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const z = +b.dataset.z;
  if (state.facing !== 'environment') { if (z < 1) return; setZoomUI(z); applyDigitalZoom(z); return; }
  if (!state.lenses) await findLenses();
  const L = state.lenses || {};
  let device = L.wide ? L.wide.deviceId : null, digital = z;
  if (z === 0.5) {
    if (!L.ultra) { alert('Lensa ultra-wide (0.5x) tidak tersedia di iPhone/browser ini.'); return; }
    device = L.ultra.deviceId; digital = 1;
  }
  setZoomUI(z); applyDigitalZoom(digital);
  if (device !== state.deviceId) { state.deviceId = device; await startCamera(); }
};

/* ---------- Location ---------- */
async function reverseGeocode(lat, lon) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&accept-language=id&zoom=17`);
    const j = await r.json(); const a = j.address || {};
    const parts = [
      a.road || a.neighbourhood || a.hamlet || a.village || a.suburb,
      a.city || a.town || a.county || a.municipality || a.city_district,
      a.state
    ].filter(Boolean);
    return parts.length ? parts.join(', ') : j.display_name;
  } catch { return `${lat.toFixed(5)}, ${lon.toFixed(5)}`; }
}
function getLocation() {
  if (!navigator.geolocation) { state.autoLoc = 'Lokasi tidak tersedia'; renderWm(); return; }
  state.autoLoc = 'Mencari lokasi…'; renderWm();
  navigator.geolocation.getCurrentPosition(async p => {
    state.coords = { lat: p.coords.latitude, lon: p.coords.longitude };
    state.autoLoc = await reverseGeocode(state.coords.lat, state.coords.lon);
    renderWm();
  }, () => { state.autoLoc = 'Izin lokasi ditolak'; renderWm(); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}
$('locBtn').onclick = getLocation;

/* ---------- Edit sheet ---------- */
function openSheet(id) { $(id).classList.add('open'); }
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => {
  if (e.target === s || e.target.hasAttribute('data-close')) s.classList.remove('open');
}));
$('editBtn').onclick = $('menuBtn').onclick = $('tplBtn').onclick = $('teamBtn').onclick = () => {
  $('inLoc').value = state.manualLoc; $('inNote').value = state.note; $('inCoord').checked = state.showCoord;
  openSheet('editSheet');
};
$('saveEdit').onclick = () => {
  state.manualLoc = $('inLoc').value.trim(); state.note = $('inNote').value.trim(); state.showCoord = $('inCoord').checked;
  store.set('manualLoc', state.manualLoc); store.set('note', state.note); store.set('showCoord', state.showCoord);
  renderWm(); $('editSheet').classList.remove('open');
};

/* ---------- Capture ---------- */
function drawWatermark(ctx, W, H, s) {   // s = canvas px per on-screen CSS px
  const pad = 16 * s;
  const d = new Date();
  const time = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  const date = `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  const day = DAYS[d.getDay()];
  const locLines = locText().split('\n');
  const note = state.note;

  ctx.save();
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 3 * s; ctx.shadowOffsetY = 1 * s;

  const timeSize = 64 * s, small = 18 * s, gap = 10 * s;
  let y = H - pad;

  // Note box
  if (note) {
    ctx.font = `400 ${small}px Oswald, sans-serif`;
    const tw = ctx.measureText(note).width, bh = small + 16 * s;
    ctx.save(); ctx.shadowColor = 'transparent';
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    roundRect(ctx, pad, y - bh, tw + 28 * s, bh, 6 * s); ctx.fill(); ctx.restore();
    ctx.fillText(note, pad + 14 * s, y - 8 * s - small * 0.12);
    y -= bh + gap;
  }
  // Location
  ctx.font = `400 ${small}px Oswald, sans-serif`;
  for (let i = locLines.length - 1; i >= 0; i--) { ctx.fillText(locLines[i], pad, y - small * 0.15); y -= small * 1.3; }
  y -= gap - small * 0.3;
  // Time
  ctx.font = `300 ${timeSize}px Oswald, sans-serif`;
  const tW = ctx.measureText(time).width;
  ctx.fillText(time, pad, y - timeSize * 0.12);
  const top = y - timeSize;
  // Gold bar
  ctx.save(); ctx.shadowColor = 'transparent'; ctx.fillStyle = '#E8B84A';
  ctx.fillRect(pad + tW + 12 * s, top + 4 * s, 3 * s, timeSize - 8 * s); ctx.restore();
  // Date / day
  ctx.font = `400 ${small}px Oswald, sans-serif`;
  const x2 = pad + tW + 27 * s;
  ctx.fillText(date, x2, top + small + 4 * s);
  ctx.fillText(day, x2, y - timeSize * 0.12);
  ctx.restore();
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* ---------- Capture (photo & video) ---------- */
// 9:16 portrait crop of the camera frame, with digital zoom
function frameRect() {
  const vw = video.videoWidth, vh = video.videoHeight, R = 9 / 16;
  let cw = vw, ch = vh;
  if (vw / vh > R) cw = vh * R; else ch = vw / R;
  const sw = cw / state.zoom, sh = ch / state.zoom;
  return { sx: (vw - sw) / 2, sy: (vh - sh) / 2, sw, sh, W: Math.round(cw), H: Math.round(ch) };
}
function drawFrame(ctx, W, H) {
  const r = frameRect();
  ctx.save();
  if (state.facing === 'user') { ctx.translate(W, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, r.sx, r.sy, r.sw, r.sh, 0, 0, W, H);
  ctx.restore();
  drawWatermark(ctx, W, H, Math.min(W, H) / 390 * 0.82);
}
function showResult(blob, kind) {
  if (state.lastUrl) URL.revokeObjectURL(state.lastUrl);
  state.lastBlob = blob; state.lastKind = kind; state.lastUrl = URL.createObjectURL(blob);
  const img = $('prevImg'), vid = $('prevVid');
  if (kind === 'photo') {
    $('thumbBox').style.backgroundImage = `url(${state.lastUrl})`;
    img.hidden = false; img.src = state.lastUrl; vid.hidden = true; vid.removeAttribute('src');
  } else {
    img.hidden = true; vid.hidden = false; vid.src = state.lastUrl;
  }
  openSheet('prevSheet');
}

function takePhoto() {
  const f = $('flash'); f.classList.add('go'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('go')));
  const { W, H } = frameRect();
  const c = $('canvas'); c.width = W; c.height = H;
  drawFrame(c.getContext('2d'), W, H);
  c.toBlob(blob => showResult(blob, 'photo'), 'image/jpeg', 0.92);
}

/* Video: draw camera + live watermark onto a canvas and record that canvas */
const rec = { recorder: null, chunks: [], raf: 0, timer: 0, start: 0, audio: null, canvas: null };
function pickMime() {
  const opts = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  return opts.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
}
async function startRecording() {
  if (!window.MediaRecorder) { alert('Browser ini belum mendukung rekam video.'); return; }
  const fr = frameRect();
  const scale = Math.min(1, 1080 / fr.W);                 // cap at 1080x1920 so the phone keeps up
  const W = Math.round(fr.W * scale / 2) * 2, H = Math.round(fr.H * scale / 2) * 2;
  const c = rec.canvas || (rec.canvas = document.createElement('canvas'));
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const loop = () => { drawFrame(ctx, W, H); rec.raf = requestAnimationFrame(loop); };
  loop();

  const stream = c.captureStream(30);
  try {
    rec.audio = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec.audio.getAudioTracks().forEach(tr => stream.addTrack(tr));
  } catch { rec.audio = null; }                           // no mic permission: record without sound

  const mime = pickMime();
  try { rec.recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 8e6 } : undefined); }
  catch { rec.recorder = new MediaRecorder(stream); }
  rec.chunks = [];
  rec.recorder.ondataavailable = e => { if (e.data && e.data.size) rec.chunks.push(e.data); };
  rec.recorder.onstop = () => {
    cancelAnimationFrame(rec.raf);
    if (rec.audio) rec.audio.getTracks().forEach(tr => tr.stop());
    stream.getTracks().forEach(tr => tr.stop());
    const type = rec.recorder.mimeType || mime || 'video/mp4';
    const blob = new Blob(rec.chunks, { type });
    if (blob.size) showResult(blob, 'video');
  };
  rec.recorder.start(1000);
  rec.start = Date.now();
  document.body.classList.add('recording');
  const tick = () => {
    const s = Math.floor((Date.now() - rec.start) / 1000);
    $('recTime').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  };
  tick(); rec.timer = setInterval(tick, 500);
}
function stopRecording() {
  clearInterval(rec.timer);
  document.body.classList.remove('recording');
  if (rec.recorder && rec.recorder.state !== 'inactive') rec.recorder.stop();
}

/* Mode switch */
state.mode = 'photo';
$('modes').onclick = e => {
  const s = e.target.closest('[data-mode]'); if (!s || document.body.classList.contains('recording')) return;
  state.mode = s.dataset.mode;
  [...$('modes').children].forEach(x => x.classList.toggle('on', x === s));
  document.body.classList.toggle('video-mode', state.mode === 'video');
  $('shutter').setAttribute('aria-label', state.mode === 'video' ? 'Rekam video' : 'Ambil foto');
};

$('shutter').onclick = () => {
  if (!video.videoWidth) return;
  if (state.mode === 'photo') return takePhoto();
  if (document.body.classList.contains('recording')) stopRecording(); else startRecording();
};

$('thumbBtn').onclick = () => { if (state.lastUrl) openSheet('prevSheet'); };
document.querySelectorAll('#prevSheet [data-close], #prevSheet').forEach(el => el.addEventListener('click', () => { const v = $('prevVid'); if (!v.hidden) v.pause(); }));

$('saveBtn').onclick = async () => {
  if (!state.lastBlob) return;
  const d = new Date(), p2 = n => String(n).padStart(2, '0');
  const isVid = state.lastKind === 'video';
  const type = isVid ? (state.lastBlob.type.split(';')[0] || 'video/mp4') : 'image/jpeg';
  const ext = isVid ? (type.includes('webm') ? 'webm' : 'mp4') : 'jpg';
  const name = `TimeCam_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}.${ext}`;
  const file = new File([state.lastBlob], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = state.lastUrl; a.download = name; a.click();
};

/* ---------- Full-screen height ----------
   iOS home-screen apps often report a viewport shorter than the screen, leaving a blank strip at the bottom.
   In standalone mode use the full screen height so the bottom bar sits at the very bottom. */
function fitHeight() {
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const portrait = innerHeight >= innerWidth;
  const h = standalone && portrait ? Math.max(innerHeight, screen.height) : innerHeight;
  document.documentElement.style.setProperty('--app-h', h + 'px');
}
fitHeight(); addEventListener('resize', fitHeight);
// keep the right rail just above the bottom panel
try { new ResizeObserver(() => document.documentElement.style.setProperty('--panel-h', $('panel').offsetHeight + 'px')).observe($('panel')); } catch {} addEventListener('orientationchange', () => setTimeout(fitHeight, 300));

/* ---------- Boot ---------- */
document.fonts && document.fonts.load('300 64px Oswald');
startCamera();
getLocation();
document.addEventListener('visibilitychange', () => { if (!document.hidden && (!state.stream || !state.stream.active)) startCamera(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
