<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TimeCam">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Oswald:wght@300;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<title>TimeCam</title>
<style>
  :root { --gold:#E8B84A; --bg:#fff; --ink:#111; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); font-family:Poppins,system-ui,sans-serif; overflow:hidden; overscroll-behavior:none; }
  .app { position:fixed; inset:0; height:100dvh; display:flex; flex-direction:column; }

  /* Top bar */
  .top { padding:calc(env(safe-area-inset-top) + 8px) 16px 10px; display:flex; align-items:center; justify-content:space-between; background:#fff; }
  .icon-btn { width:44px; height:44px; border:0; background:none; display:grid; place-items:center; padding:0; }
  .icon-btn svg { width:28px; height:28px; stroke:#111; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .pill { border:2px solid #111; border-radius:999px; padding:6px 14px; font-weight:600; font-size:15px; display:flex; gap:6px; align-items:center; background:#fff; }
  .pill svg { width:18px; height:18px; stroke:#111; fill:none; stroke-width:2; }

  /* Viewfinder */
  .stage { position:relative; flex:1; min-height:0; background:#000; overflow:hidden; }
  video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform-origin:center; }
  video.mirror { transform:scaleX(-1); }
  .msg { position:absolute; inset:0; display:grid; place-items:center; color:#fff; text-align:center; padding:24px; font-size:15px; }
  .msg button { margin-top:12px; background:var(--gold); color:#111; border:0; border-radius:999px; padding:10px 20px; font:600 15px Poppins; }

  /* Right rail: zoom + tools in one column so they never overlap */
  .rail { position:absolute; right:10px; top:12px; bottom:12px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:clamp(8px, 2vh, 16px); }
  .zoom { display:flex; flex-direction:column; gap:clamp(6px, 1.5vh, 12px); align-items:center; }
  .zoom button { width:40px; height:40px; border-radius:50%; border:0; background:rgba(0,0,0,.35); color:#fff; font:500 14px Poppins; padding:0; }
  .zoom button.on { width:50px; height:50px; border:3px solid #fff; background:rgba(0,0,0,.45); font-size:16px; }
  .side { display:flex; flex-direction:column; gap:clamp(6px, 1.5vh, 12px); margin-top:clamp(8px, 2vh, 20px); }
  .side button { width:44px; height:44px; border:0; background:none; padding:0; display:grid; place-items:center; }
  .side svg { width:32px; height:32px; stroke:#fff; fill:none; stroke-width:2; filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)); }

  /* Watermark — same proportions as the saved photo (0.82 of a 390px layout) */
  .wm { position:absolute; left:14px; right:70px; bottom:14px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.45); pointer-events:none; }
  .wm-row { display:flex; align-items:stretch; gap:10px; }
  .wm-time { font:300 52px/1 Oswald, sans-serif; letter-spacing:1px; }
  .wm-bar { width:3px; background:var(--gold); border-radius:2px; }
  .wm-dd { display:flex; flex-direction:column; justify-content:space-between; font:400 15px Oswald,sans-serif; padding:2px 0; }
  .wm-loc { margin-top:8px; font:400 15px Oswald,sans-serif; }
  .wm-note { margin-top:8px; display:inline-block; background:rgba(0,0,0,.18); border-radius:5px; padding:6px 11px; font:400 15px Oswald,sans-serif; }
  .wm-note:empty { display:none; }

  /* Shutter bar — its own row below the viewfinder, nothing stacked on the photo */
  .controls { background:#fff; display:flex; align-items:center; justify-content:space-around; padding:clamp(8px, 1.6vh, 14px) 12px; }
  .thumb { width:72px; text-align:center; color:#111; font:600 13px Poppins; border:0; background:none; padding:0; }
  .thumb .box { width:46px; height:54px; margin:0 auto 4px; border-radius:8px; background:#e9e9e9 center/cover; border:2px solid #ddd; }
  .shutter { width:clamp(64px, 9vh, 78px); height:clamp(64px, 9vh, 78px); border-radius:50%; border:5px solid #111; background:#fff; box-shadow:inset 0 0 0 3px #fff, inset 0 0 0 40px #f2f2f2; }
  .shutter:active { box-shadow:inset 0 0 0 3px #fff, inset 0 0 0 40px #ccc; }
  .tpl svg { width:40px; height:40px; stroke:#111; fill:none; stroke-width:2; margin:0 auto 4px; display:block; }

  /* Bottom mode bar */
  .modes { background:#fff; padding:6px 8px calc(env(safe-area-inset-bottom) + 14px); display:flex; justify-content:space-around; font:600 16px Poppins; color:#9a9a9a; }
  .modes span.on { color:#111; position:relative; }
  .modes span.on::after { content:""; position:absolute; left:50%; bottom:-10px; width:6px; height:6px; border-radius:50%; background:#111; transform:translateX(-50%); }

  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .25s; }
  .flash.go { opacity:.8; transition:none; }

  /* Sheets */
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; z-index:10; }
  .sheet.open { display:flex; }
  .card { background:#fff; width:100%; border-radius:18px 18px 0 0; padding:20px 18px calc(env(safe-area-inset-bottom) + 18px); max-height:90vh; overflow:auto; }
  .card h3 { margin:0 0 14px; font-size:18px; }
  .card label { display:block; font-size:13px; color:#666; margin:12px 0 4px; }
  .card input, .card textarea { width:100%; font:16px Poppins; padding:10px 12px; border:1px solid #ddd; border-radius:10px; }
  .row { display:flex; gap:10px; margin-top:16px; }
  .btn { flex:1; border:0; border-radius:12px; padding:13px; font:600 16px Poppins; background:#111; color:#fff; }
  .btn.alt { background:#eee; color:#111; }
  .btn.gold { background:var(--gold); color:#111; }
  .preview img { width:100%; border-radius:10px; display:block; }
  .hint { font-size:12px; color:#888; margin-top:10px; text-align:center; }
  .toggle { display:flex; align-items:center; justify-content:space-between; margin-top:14px; font-size:15px; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="icon-btn" id="menuBtn" aria-label="Pengaturan"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h14M3 18h10"/></svg></button>
    <button class="icon-btn" id="torchBtn" aria-label="Flash"><svg viewBox="0 0 24 24" id="torchIcon"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/><path d="M3 3l18 18" id="torchSlash"/></svg></button>
    <div class="pill"><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>Verified</div>
    <button class="icon-btn" id="flipBtn" aria-label="Ganti kamera"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3"/><path d="M8 6l1.5-2h5L16 6"/></svg></button>
  </div>

  <div class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <div class="msg" id="msg"><div>Mengaktifkan kamera…</div></div>
    <div class="flash" id="flash"></div>

    <div class="rail">
      <div class="zoom" id="zoom">
        <button data-z="2">2</button>
        <button data-z="1" class="on">1x</button>
        <button data-z="1.5">1.5</button>
      </div>

      <div class="side">
        <button id="editBtn" aria-label="Edit catatan"><svg viewBox="0 0 24 24"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L13 14l-4 1 1-4z"/></svg></button>
        <button id="locBtn" aria-label="Refresh lokasi"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></button>
      </div>

    </div>

    <div class="wm" id="wm">
      <div class="wm-row">
        <div class="wm-time" id="wTime">--:--</div>
        <div class="wm-bar"></div>
        <div class="wm-dd"><span id="wDate"></span><span id="wDay"></span></div>
      </div>
      <div class="wm-loc" id="wLoc">Mencari lokasi…</div>
      <div><span class="wm-note" id="wNote"></span></div>
    </div>
  </div>

    <div class="controls">
      <button class="thumb" id="thumbBtn"><div class="box" id="thumbBox"></div>Preview</button>
      <button class="shutter" id="shutter" aria-label="Ambil foto"></button>
      <button class="thumb tpl" id="tplBtn"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>Templates</button>
    </div>

  <div class="modes"><span>Reports</span><span>Video</span><span class="on">Photo</span><span>Clock</span><span>Checklist</span></div>
</div>

<!-- Edit sheet -->
<div class="sheet" id="editSheet">
  <div class="card">
    <h3>Edit Watermark</h3>
    <label>Lokasi (kosongkan untuk otomatis dari GPS)</label>
    <input id="inLoc" placeholder="Jalan …, Kota, Provinsi">
    <label>Catatan</label>
    <textarea id="inNote" rows="2" placeholder="I've been here :)"></textarea>
    <div class="toggle"><span>Tampilkan koordinat</span><input type="checkbox" id="inCoord" style="width:auto"></div>
    <div class="row"><button class="btn alt" data-close>Batal</button><button class="btn" id="saveEdit">Simpan</button></div>
  </div>
</div>

<!-- Preview sheet -->
<div class="sheet" id="prevSheet">
  <div class="card preview">
    <img id="prevImg" alt="Hasil foto">
    <div class="row"><button class="btn alt" data-close>Tutup</button><button class="btn gold" id="saveBtn">Simpan ke Foto</button></div>
    <div class="hint">Di iPhone: tekan "Simpan ke Foto" → pilih <b>Save Image</b>. Atau tekan-tahan gambar → Save to Photos.</div>
  </div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), msg = $('msg');
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const state = {
  facing: 'environment', zoom: 1, torch: false, stream: null,
  autoLoc: 'Mencari lokasi…', coords: null,
  manualLoc: store.get('manualLoc', ''), note: store.get('note', "I've been here :)"), showCoord: store.get('showCoord', false),
  lastBlob: null, lastUrl: null
};

/* ---------- Clock ---------- */
function tick() {
  const d = new Date();
  $('wTime').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  $('wDate').textContent = `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  $('wDay').textContent = DAYS[d.getDay()];
}
tick(); setInterval(tick, 1000);

function locText() {
  let t = state.manualLoc || state.autoLoc;
  if (state.showCoord && state.coords) t += `\n${state.coords.lat.toFixed(6)}, ${state.coords.lon.toFixed(6)}`;
  return t;
}
function renderWm() {
  $('wLoc').innerText = locText();
  $('wNote').textContent = state.note;
}
renderWm();

/* ---------- Camera ---------- */
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('timeout'), { name: 'Timeout' })), ms))]);
async function startCamera() {
  if (state.stream) state.stream.getTracks().forEach(t => t.stop());
  msg.style.display = 'grid';
  msg.innerHTML = '<div>Mengaktifkan kamera…<br><small>Izinkan akses kamera jika diminta</small></div>';
  // Try high resolution first, then fall back if the browser refuses or stalls
  const tries = [
    { facingMode: { ideal: state.facing }, width: { ideal: 3840 }, height: { ideal: 2160 }, aspectRatio: { ideal: 16 / 9 } },
    { facingMode: { ideal: state.facing }, width: { ideal: 1920 }, height: { ideal: 1080 }, aspectRatio: { ideal: 16 / 9 } },
    { facingMode: state.facing }
  ];
  let lastErr;
  for (const v of tries) {
    try {
      state.stream = await withTimeout(navigator.mediaDevices.getUserMedia({ audio: false, video: v }), 10000);
      video.srcObject = state.stream;
      video.classList.toggle('mirror', state.facing === 'user');
      video.play().catch(() => {});
      await withTimeout(new Promise(r => video.readyState >= 2 ? r() : video.addEventListener('loadeddata', r, { once: true })), 5000);
      msg.style.display = 'none';
      state.torch = false; updateTorchIcon();
      return;
    } catch (e) {
      lastErr = e;
      if (e.name === 'NotAllowedError') break;            // permission denied: no point retrying
      if (state.stream) state.stream.getTracks().forEach(t => t.stop());
    }
  }
  const hint = lastErr && lastErr.name === 'NotAllowedError'
    ? 'Izin kamera ditolak. Buka Settings → Safari → Camera → Allow, lalu coba lagi.'
    : 'Kamera tidak bisa diakses.';
  msg.innerHTML = `<div>${hint}<br><small>${(lastErr && lastErr.name) || ''}</small><br><button id="retry">Coba lagi</button></div>`;
  $('retry').onclick = startCamera;
}
$('flipBtn').onclick = () => { state.facing = state.facing === 'environment' ? 'user' : 'environment'; startCamera(); };

/* Torch (Android Chrome supports; iOS Safari usually not) */
function updateTorchIcon() { $('torchSlash').style.display = state.torch ? 'none' : ''; }
$('torchBtn').onclick = async () => {
  const track = state.stream && state.stream.getVideoTracks()[0];
  const caps = track && track.getCapabilities ? track.getCapabilities() : {};
  if (!caps.torch) { alert('Flash tidak didukung browser ini (Safari iPhone belum mendukung flash untuk web app).'); return; }
  state.torch = !state.torch;
  try { await track.applyConstraints({ advanced: [{ torch: state.torch }] }); } catch {}
  updateTorchIcon();
};

/* Digital zoom */
$('zoom').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  state.zoom = +b.dataset.z;
  [...$('zoom').children].forEach(x => { x.classList.toggle('on', x === b); x.textContent = x.dataset.z + (x === b ? 'x' : ''); });
  video.style.transform = (state.facing === 'user' ? 'scaleX(-1) ' : '') + `scale(${state.zoom})`;
};

/* ---------- Location ---------- */
async function reverseGeocode(lat, lon) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&accept-language=id&zoom=17`);
    const j = await r.json(); const a = j.address || {};
    const parts = [
      a.road || a.neighbourhood || a.hamlet || a.village || a.suburb,
      a.city || a.town || a.county || a.municipality || a.city_district,
      a.state
    ].filter(Boolean);
    return parts.length ? parts.join(', ') : j.display_name;
  } catch { return `${lat.toFixed(5)}, ${lon.toFixed(5)}`; }
}
function getLocation() {
  if (!navigator.geolocation) { state.autoLoc = 'Lokasi tidak tersedia'; renderWm(); return; }
  state.autoLoc = 'Mencari lokasi…'; renderWm();
  navigator.geolocation.getCurrentPosition(async p => {
    state.coords = { lat: p.coords.latitude, lon: p.coords.longitude };
    state.autoLoc = await reverseGeocode(state.coords.lat, state.coords.lon);
    renderWm();
  }, () => { state.autoLoc = 'Izin lokasi ditolak'; renderWm(); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}
$('locBtn').onclick = getLocation;

/* ---------- Edit sheet ---------- */
function openSheet(id) { $(id).classList.add('open'); }
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => {
  if (e.target === s || e.target.hasAttribute('data-close')) s.classList.remove('open');
}));
$('editBtn').onclick = $('menuBtn').onclick = $('tplBtn').onclick = () => {
  $('inLoc').value = state.manualLoc; $('inNote').value = state.note; $('inCoord').checked = state.showCoord;
  openSheet('editSheet');
};
$('saveEdit').onclick = () => {
  state.manualLoc = $('inLoc').value.trim(); state.note = $('inNote').value.trim(); state.showCoord = $('inCoord').checked;
  store.set('manualLoc', state.manualLoc); store.set('note', state.note); store.set('showCoord', state.showCoord);
  renderWm(); $('editSheet').classList.remove('open');
};

/* ---------- Capture ---------- */
function drawWatermark(ctx, W, H, s) {   // s = canvas px per on-screen CSS px
  const pad = 16 * s;
  const d = new Date();
  const time = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  const date = `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  const day = DAYS[d.getDay()];
  const locLines = locText().split('\n');
  const note = state.note;

  ctx.save();
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 3 * s; ctx.shadowOffsetY = 1 * s;

  const timeSize = 64 * s, small = 18 * s, gap = 10 * s;
  let y = H - pad;

  // Note box
  if (note) {
    ctx.font = `400 ${small}px Oswald, sans-serif`;
    const tw = ctx.measureText(note).width, bh = small + 16 * s;
    ctx.save(); ctx.shadowColor = 'transparent';
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    roundRect(ctx, pad, y - bh, tw + 28 * s, bh, 6 * s); ctx.fill(); ctx.restore();
    ctx.fillText(note, pad + 14 * s, y - 8 * s - small * 0.12);
    y -= bh + gap;
  }
  // Location
  ctx.font = `400 ${small}px Oswald, sans-serif`;
  for (let i = locLines.length - 1; i >= 0; i--) { ctx.fillText(locLines[i], pad, y - small * 0.15); y -= small * 1.3; }
  y -= gap - small * 0.3;
  // Time
  ctx.font = `300 ${timeSize}px Oswald, sans-serif`;
  const tW = ctx.measureText(time).width;
  ctx.fillText(time, pad, y - timeSize * 0.12);
  const top = y - timeSize;
  // Gold bar
  ctx.save(); ctx.shadowColor = 'transparent'; ctx.fillStyle = '#E8B84A';
  ctx.fillRect(pad + tW + 12 * s, top + 4 * s, 3 * s, timeSize - 8 * s); ctx.restore();
  // Date / day
  ctx.font = `400 ${small}px Oswald, sans-serif`;
  const x2 = pad + tW + 27 * s;
  ctx.fillText(date, x2, top + small + 4 * s);
  ctx.fillText(day, x2, y - timeSize * 0.12);
  ctx.restore();
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

$('shutter').onclick = async () => {
  if (!video.videoWidth) return;
  const f = $('flash'); f.classList.add('go'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('go')));

  // Use the camera's full frame (9:16 portrait on iPhone, like Timemark) at full resolution
  const stage = $('stage').getBoundingClientRect();
  // Always output exactly 9:16 portrait (like Timemark), center-cropped from whatever the camera gives
  const vw = video.videoWidth, vh = video.videoHeight;
  const R = 9 / 16;
  let cw = vw, ch = vh;
  if (vw / vh > R) cw = vh * R; else ch = vw / R;
  const W = Math.round(cw), H = Math.round(ch);          // full-res 9:16 at 1x
  const sw = cw / state.zoom, sh = ch / state.zoom;       // digital zoom crops further
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  const c = $('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.save();
  if (state.facing === 'user') { ctx.translate(W, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
  ctx.restore();

  // Watermark sized relative to photo width (layout designed for a 390px-wide phone), a bit smaller like Timemark
  drawWatermark(ctx, W, H, Math.min(W, H) / 390 * 0.82);

  c.toBlob(blob => {
    if (state.lastUrl) URL.revokeObjectURL(state.lastUrl);
    state.lastBlob = blob; state.lastUrl = URL.createObjectURL(blob);
    $('thumbBox').style.backgroundImage = `url(${state.lastUrl})`;
    $('prevImg').src = state.lastUrl;
    openSheet('prevSheet');
  }, 'image/jpeg', 0.92);
};

$('thumbBtn').onclick = () => { if (state.lastUrl) openSheet('prevSheet'); };

$('saveBtn').onclick = async () => {
  if (!state.lastBlob) return;
  const d = new Date();
  const name = `TimeCam_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}.jpg`;
  const file = new File([state.lastBlob], name, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = state.lastUrl; a.download = name; a.click();
};

/* ---------- Boot ---------- */
document.fonts && document.fonts.load('300 64px Oswald');
startCamera();
getLocation();
document.addEventListener('visibilitychange', () => { if (!document.hidden && (!state.stream || !state.stream.active)) startCamera(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
